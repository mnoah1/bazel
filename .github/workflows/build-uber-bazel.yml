name: Build Uber Bazel 8.8.0-uber.6

on:
  workflow_dispatch:
  push:
    branches:
      - mnoah1/fix-metadata-only-rewind-storm

permissions:
  contents: read

env:
  BAZEL_VERSION: 8.8.0
  RELEASE_NAME: 8.8.0-uber.6

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            bootstrap_sha256: ca189f994f632c91c275443b8571652e3ea190fc2437a5798121ba7e5a9a2f29
            # Ubuntu 18.04 provides the GCC 7/glibc 2.27 release-era ABI baseline.
            build_image: ubuntu@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe
          - runner: ubuntu-24.04-arm
            arch: arm64
            bootstrap_sha256: 861bc2fb6adb9db2e1daa409d4503605475d374ff63c25fe96b3330063151fd5
            build_image: ubuntu@sha256:f97a5103cca28097326814718e711c9c41b54853c26959d73495e40b1dd608f2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified Bazel bootstrap
        env:
          BOOTSTRAP_SHA256: ${{ matrix.bootstrap_sha256 }}
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/bazel-bootstrap \
            "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-linux-${{ matrix.arch }}"
          echo "${BOOTSTRAP_SHA256}  /tmp/bazel-bootstrap" | sha256sum --check --strict
          chmod +x /tmp/bazel-bootstrap

      - name: Build optimized Bazel in compatibility container
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume /tmp/bazel-bootstrap:/tmp/bazel-bootstrap:ro \
            --workdir /workspace \
            --env RELEASE_NAME \
            --env TARGET_ARCH \
            "${BUILD_IMAGE}" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                ca-certificates curl file g++ git patch python3 unzip zip

              git config --global --add safe.directory /workspace

              /tmp/bazel-bootstrap build \
                --sandbox_tmpfs_path=/tmp \
                //src:bazel

              mkdir -p output
              cp bazel-bin/src/bazel output/bazel

              output/bazel build \
                -c opt \
                --stamp \
                --sandbox_tmpfs_path=/tmp \
                --embed_label="${RELEASE_NAME}" \
                --workspace_status_command=scripts/ci/build_status_command.sh \
                //src:bazel

              artifact="bazel-${RELEASE_NAME}-linux-${TARGET_ARCH}"
              cp bazel-bin/src/bazel "${artifact}"
              "./${artifact}" --version
              file "${artifact}"
              sha256sum "${artifact}" > "${artifact}.sha256"

              for namespace in GLIBC GLIBCXX CXXABI; do
                readelf --version-info "${artifact}" \
                  | grep -oE "${namespace}_[0-9.]+" \
                  | sort -Vu \
                  | tail -n 1
              done
            '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-${{ env.RELEASE_NAME }}-linux-${{ matrix.arch }}
          path: |
            bazel-${{ env.RELEASE_NAME }}-linux-${{ matrix.arch }}
            bazel-${{ env.RELEASE_NAME }}-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  darwin:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            bootstrap_sha256: 1aacca2986252c4a3ab721fda9aa1e825d8e7d1ab94ffac523234a913c060fa4
          - runner: macos-15
            arch: arm64
            bootstrap_sha256: f0ac192aba2ccaa373cdfd527d4c407cc492c1296a2f11a4b67563e4d5aa9acb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified Bazel bootstrap
        env:
          BOOTSTRAP_SHA256: ${{ matrix.bootstrap_sha256 }}
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/bazel-bootstrap \
            "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-darwin-${{ matrix.arch }}"
          echo "${BOOTSTRAP_SHA256}  /tmp/bazel-bootstrap" | shasum --algorithm 256 --check
          chmod +x /tmp/bazel-bootstrap

      - name: Build optimized Bazel
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          /tmp/bazel-bootstrap build //src:bazel

          mkdir -p output
          cp bazel-bin/src/bazel output/bazel

          output/bazel build \
            -c opt \
            --stamp \
            --embed_label="${RELEASE_NAME}" \
            --workspace_status_command=scripts/ci/build_status_command.sh \
            //src:bazel

          artifact="bazel-${RELEASE_NAME}-darwin-${TARGET_ARCH}"
          cp bazel-bin/src/bazel "${artifact}"
          "./${artifact}" --version
          file "${artifact}"
          shasum --algorithm 256 "${artifact}" > "${artifact}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-${{ env.RELEASE_NAME }}-darwin-${{ matrix.arch }}
          path: |
            bazel-${{ env.RELEASE_NAME }}-darwin-${{ matrix.arch }}
            bazel-${{ env.RELEASE_NAME }}-darwin-${{ matrix.arch }}.sha256
          if-no-files-found: error
